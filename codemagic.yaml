workflows:
  android:
    name: GibelaSA Android

    environment:
      flutter: stable

    scripts:
      - name: Get dependencies
        script: |
          cd mobile
          flutter pub get

      - name: Build Android
        script: |
          cd mobile
          flutter build apk --release

    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk

ios:
  name: GibelaSA iOS Simulator

  environment:
    flutter: stable
    xcode: latest

  scripts:
    - name: Get dependencies
      script: |
        cd mobile
        flutter pub get

    - name: Build iOS without signing
      script: |
        cd mobile
        flutter build ios --debug --no-codesign

  artifacts:
    - mobile/build/ios/iphoneos/**/*.app
  
  
      