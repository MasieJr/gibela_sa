workflows:
  gibelasa-ios:
    name: GibelaSA iOS IPA

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA for Sideloadly
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r GibelaSA.ipa Payload
          rm -rf Payload

    artifacts:
      - GibelaSA.ipa
      - build/ios/iphoneos/Runner.app